name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: Jepsen random seed
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        otp: ["26", "27", "28"]
        elixir: ["1.19"]
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: elixir --sname ci --cookie ekv_test -S mix test

  jepsen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - register-3n-none
          - register-3n-partition-flap
          - register-3n-restart-one-small
          - register-5n-none
          - lock-3n-none
          - lock-3n-partition-flap
          - lock-3n-restart-one-small
          - lock-3n-partition-restart
          - lock-5n-none
          - lock-5n-partition-restart
    env:
      MIX_ENV: test
      JAVA_TOOL_OPTIONS: -Xmx2g
      SCENARIO: ${{ matrix.scenario }}
      SEED: ${{ inputs.seed || '1' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Leiningen
        run: |
          sudo apt-get update
          sudo apt-get install --yes leiningen

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jepsen-java21-${{ hashFiles('jepsen/project.clj') }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: lein test
        working-directory: jepsen

      - name: Run Jepsen scenario
        working-directory: jepsen
        timeout-minutes: 20
        run: |
          mkdir -p results
          ./run_scenario.sh "$SCENARIO" "$SEED" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>&1 | tee results/ci.log

      - name: Upload Jepsen history and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jepsen-${{ matrix.scenario }}-seed-${{ env.SEED }}
          path: |
            jepsen/results/
            jepsen/store/
          retention-days: 14
          if-no-files-found: ignore
